<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#021f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>ICC Lesson Log</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ───────────────────────────────────── */
    .header {
      background: linear-gradient(180deg, #052d54 0%, #021f3d 100%);
      color: #fff;
      padding: 20px 16px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header img {
      width: 36px;
      height: 36px;
      margin-bottom: 4px;
      border-radius: 6px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .header .user-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      padding: 3px 12px;
      border-radius: 20px;
    }

    /* ─── Container ────────────────────────────────── */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ─── Screens ──────────────────────────────────── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ─── Cards ────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* ─── Buttons ──────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #052d54, #021f3d);
      color: #fff;
    }

    /* ─── Form Inputs ─────────────────────────────── */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      color: #1a1a1a;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #052d54;
      background: #fff;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    /* ─── Toggle Buttons ──────────────────────────── */
    .btn-row {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, #052d54, #021f3d);
      color: #fff;
      border-color: #052d54;
    }

    .toggle-btn.guest-active {
      background: #dc3545;
      color: #fff;
      border-color: #dc3545;
    }

    .toggle-btn.member-active {
      background: #28a745;
      color: #fff;
      border-color: #28a745;
    }

    .toggle-btn.half-active {
      background: #e67e22;
      color: #fff;
      border-color: #e67e22;
    }

    /* ─── People Counter ──────────────────────────── */
    .people-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .people-row button {
      width: 44px;
      height: 44px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
      color: #052d54;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .people-row button:active {
      background: #052d54;
      color: #fff;
      border-color: #052d54;
    }

    .people-count {
      font-size: 1.2rem;
      font-weight: 700;
      min-width: 28px;
      text-align: center;
      color: #052d54;
    }

    /* ─── Status ───────────────────────────────────── */
    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 24px;
      font-weight: 600;
    }
    .status.success { color: #155724; }
    .status.error { color: #721c24; }

    /* ─── Recent Lessons ──────────────────────────── */
    .recent-log {
      margin-top: 20px;
    }

    .recent-log h2 {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 10px;
    }

    .log-entry {
      padding: 14px;
      background: #fff;
      border-radius: 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    .log-entry .client-name {
      font-size: 15px;
      font-weight: 700;
      color: #052d54;
    }
    .log-entry .meta {
      font-size: 13px;
      color: #777;
      margin-top: 2px;
    }
    .log-entry .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .badge-guest { background: #f8d7da; color: #721c24; }
    .badge-member { background: #d4edda; color: #155724; }

    /* ─── Settings ─────────────────────────────────── */
    .settings-toggle { text-align: center; margin-top: 24px; }

    .settings-toggle button {
      background: none;
      border: none;
      color: #999;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    .settings {
      display: none;
      margin-top: 14px;
    }

    .settings.visible { display: block; }

    .settings .save-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #052d54, #021f3d);
      color: #fff;
      margin-top: 4px;
    }
    .settings .save-btn:active { opacity: 0.8; }

    /* ─── Setup Screen ─────────────────────────────── */
    .setup-logo { text-align: center; margin: 32px 0 16px; }
    .setup-logo img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
    }
    .setup-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #052d54;
      margin-bottom: 6px;
    }
    .setup-subtitle {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }
    .setup-error {
      color: #721c24;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="header" id="appHeader" style="display:none;">
    <img src="icon-192.png" alt="ICC" style="border-radius:6px;">
    <h1>Lesson Log</h1>
    <div class="user-badge" id="headerUser"></div>
  </div>

  <div class="container">

    <!-- ═══ SETUP SCREEN ═══ -->
    <div id="setupScreen" class="screen">
      <div class="setup-logo"><img src="icon-192.png" alt="ICC"></div>
      <div class="setup-title">ICC Lesson Log</div>
      <div class="setup-subtitle">Quick lesson tracking for ICC pros</div>
      <div class="card">
        <div class="form-group">
          <label for="setupProName">Your Name</label>
          <select id="setupProName">
            <option value="">Loading pros...</option>
          </select>
        </div>
        <button class="btn btn-primary" id="setupBtn" onclick="completeSetup()">Get Started</button>
        <p class="setup-error" id="setupError"></p>
      </div>
    </div>

    <!-- ═══ MAIN SCREEN ═══ -->
    <div id="mainScreen" class="screen">

      <div class="card">
        <form id="lessonForm">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="lessonDate">
          </div>

          <div class="form-group">
            <label>Client Name</label>
            <input type="text" id="client" placeholder="Client name" required autocomplete="off">
          </div>

          <div class="form-group">
            <label>Member / Guest</label>
            <div class="btn-row">
              <button type="button" class="toggle-btn guest-active" id="guestBtn" onclick="setGuestMember('GUEST')">Guest</button>
              <button type="button" class="toggle-btn" id="memberBtn" onclick="setGuestMember('MEMBER')">Member</button>
            </div>
          </div>

          <div class="form-group">
            <label>Duration</label>
            <div class="btn-row">
              <button type="button" class="toggle-btn" data-duration="30 minutes">30m</button>
              <button type="button" class="toggle-btn" data-duration="45 minutes">45m</button>
              <button type="button" class="toggle-btn active" data-duration="1 hour">1 hr</button>
              <button type="button" class="toggle-btn" data-duration="1.5 hours">1.5</button>
              <button type="button" class="toggle-btn" data-duration="2 hours">2 hr</button>
            </div>
          </div>

          <div class="form-group">
            <label>People</label>
            <div class="people-row">
              <button type="button" onclick="adjustPeople(-1)">&minus;</button>
              <span class="people-count" id="peopleCount">1</span>
              <button type="button" onclick="adjustPeople(1)">+</button>
            </div>
          </div>

          <div class="form-group">
            <label>Rate</label>
            <div class="btn-row">
              <button type="button" class="toggle-btn active" data-rate="FULL" onclick="setRate('FULL', this)">Full</button>
              <button type="button" class="toggle-btn" data-rate="HALF OFF" onclick="setRate('HALF OFF', this)">Half Off</button>
            </div>
          </div>

          <div class="form-group">
            <label>Notes <span style="font-weight:400;color:#999">(optional)</span></label>
            <textarea id="notes" placeholder="Quick notes..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">Log Lesson</button>
        </form>
      </div>

      <div class="status" id="status"></div>

      <div class="recent-log" id="recentLog"></div>

      <div class="settings-toggle">
        <button onclick="toggleSettings()">Settings</button>
      </div>

      <div class="settings" id="settingsPanel">
        <div class="card">
          <div class="form-group">
            <label>Your Name</label>
            <select id="proName">
              <option value="">Loading pros...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Google Script URL</label>
            <input type="url" id="scriptUrl" placeholder="https://script.google.com/macros/s/...">
          </div>
          <button class="save-btn" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>

    </div><!-- /mainScreen -->
  </div>

  <script>
    const STORAGE_KEY = 'iccLessonLog';
    const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjVnKGOgO_RfcY_6LaqldVvtVVctpb9BJkj54r_NXUF_QflKaYtAQYPcp-0Br8appF/exec';

    let settings = JSON.parse(localStorage.getItem(`${STORAGE_KEY}_settings`) || '{}');
    if (!settings.scriptUrl) settings.scriptUrl = DEFAULT_SCRIPT_URL;
    let recentLessons = JSON.parse(localStorage.getItem(`${STORAGE_KEY}_recent`) || '[]');
    let selectedDuration = '1 hour';
    let selectedGuestMember = 'GUEST';
    let selectedRate = 'FULL';
    let peopleCount = 1;

    const today = new Date();
    const dateStr = today.getFullYear() + '-' +
      String(today.getMonth() + 1).padStart(2, '0') + '-' +
      String(today.getDate()).padStart(2, '0');
    document.getElementById('lessonDate').value = dateStr;

    document.getElementById('scriptUrl').value = settings.scriptUrl || '';

    async function loadPros() {
      const selects = [document.getElementById('proName'), document.getElementById('setupProName')];
      if (!settings.scriptUrl) {
        selects.forEach(s => { if (s) s.innerHTML = '<option value="">Set Script URL first</option>'; });
        return;
      }
      try {
        const res = await fetch(settings.scriptUrl + '?action=getPros');
        const data = await res.json();
        if (data.result === 'success' && data.pros.length > 0) {
          selects.forEach(s => {
            if (!s) return;
            s.innerHTML = '<option value="">Select your name...</option>' +
              data.pros.map(p => `<option value="${p}"${p === settings.proName ? ' selected' : ''}>${p}</option>`).join('');
          });
        } else {
          selects.forEach(s => { if (s) s.innerHTML = '<option value="">No pros found — add names to Pros tab</option>'; });
        }
      } catch (err) {
        selects.forEach(s => { if (s) s.innerHTML = '<option value="">Failed to load pros</option>'; });
      }
    }

    loadPros();

    function updateHeaderBadge() {
      const badge = document.getElementById('headerUser');
      badge.textContent = settings.proName || '';
      badge.style.display = settings.proName ? 'inline-block' : 'none';
    }

    function enterMain() {
      document.getElementById('setupScreen').classList.remove('active');
      document.getElementById('mainScreen').classList.add('active');
      document.getElementById('appHeader').style.display = 'block';
      updateHeaderBadge();
    }

    function showSetup() {
      document.getElementById('mainScreen').classList.remove('active');
      document.getElementById('setupScreen').classList.add('active');
      document.getElementById('appHeader').style.display = 'none';
    }

    function completeSetup() {
      const val = document.getElementById('setupProName').value;
      const err = document.getElementById('setupError');
      if (!val) { err.textContent = 'Please select your name.'; return; }
      err.textContent = '';
      settings.proName = val;
      localStorage.setItem(`${STORAGE_KEY}_settings`, JSON.stringify(settings));
      enterMain();
    }

    if (settings.proName) { enterMain(); } else { showSetup(); }

    document.querySelectorAll('[data-duration]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-duration]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDuration = btn.dataset.duration;
      });
    });

    function setGuestMember(val) {
      selectedGuestMember = val;
      const gBtn = document.getElementById('guestBtn');
      const mBtn = document.getElementById('memberBtn');
      gBtn.className = 'toggle-btn' + (val === 'GUEST' ? ' guest-active' : '');
      mBtn.className = 'toggle-btn' + (val === 'MEMBER' ? ' member-active' : '');
    }

    function setRate(val, btn) {
      selectedRate = val;
      document.querySelectorAll('[data-rate]').forEach(b => {
        b.classList.remove('active', 'half-active');
      });
      if (val === 'HALF OFF') {
        btn.classList.add('half-active');
      } else {
        btn.classList.add('active');
      }
    }

    function adjustPeople(delta) {
      peopleCount = Math.max(1, Math.min(10, peopleCount + delta));
      document.getElementById('peopleCount').textContent = peopleCount;
    }

    document.getElementById('lessonForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const client = document.getElementById('client').value.trim();
      const notes = document.getElementById('notes').value.trim();
      const lessonDate = document.getElementById('lessonDate').value;
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      if (!client) return;

      const digitScan = (client + ' ' + notes).replace(/[\s-]/g, '');
      if (/\d{13,}/.test(digitScan)) {
        status.textContent = 'That looks like a card number — never enter credit card info here';
        status.className = 'status error';
        return;
      }

      if (!settings.scriptUrl) {
        status.textContent = 'Set your Google Script URL in Settings first';
        status.className = 'status error';
        return;
      }

      if (!settings.proName) {
        status.textContent = 'Select your name in Settings first';
        status.className = 'status error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging...';
      status.textContent = '';

      const dateParts = lessonDate.split('-');
      const displayDate = dateParts[1] + '/' + dateParts[2] + '/' + dateParts[0].slice(2);

      let displayDuration = selectedDuration;
      if (selectedRate === 'HALF OFF') {
        displayDuration = 'HALF OFF ' + selectedDuration;
      }

      const payload = {
        date: displayDate,
        pro: settings.proName,
        client,
        guestMember: selectedGuestMember,
        duration: displayDuration,
        people: peopleCount,
        rate: selectedRate,
        notes
      };

      try {
        const response = await fetch(settings.scriptUrl, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.result === 'success') {
          status.textContent = 'Logged!';
          status.className = 'status success';

          recentLessons.unshift({ ...payload, time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) });
          if (recentLessons.length > 15) recentLessons.pop();
          localStorage.setItem(`${STORAGE_KEY}_recent`, JSON.stringify(recentLessons));
          renderRecent();

          document.getElementById('client').value = '';
          document.getElementById('notes').value = '';
          peopleCount = 1;
          document.getElementById('peopleCount').textContent = '1';
          setRate('FULL', document.querySelector('[data-rate="FULL"]'));
          document.getElementById('client').focus();
        } else {
          throw new Error(result.message || 'Unknown error');
        }
      } catch (err) {
        status.textContent = 'Failed — check URL or connection';
        status.className = 'status error';
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log Lesson';
      }
    });

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('visible');
    }

    function saveSettings() {
      settings.proName = document.getElementById('proName').value;
      settings.scriptUrl = document.getElementById('scriptUrl').value.trim();
      localStorage.setItem(`${STORAGE_KEY}_settings`, JSON.stringify(settings));
      document.getElementById('settingsPanel').classList.remove('visible');
      document.getElementById('status').textContent = 'Settings saved';
      document.getElementById('status').className = 'status success';
      loadPros();
      updateHeaderBadge();
    }

    function renderRecent() {
      const container = document.getElementById('recentLog');
      if (recentLessons.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = `
        <h2>Recent Lessons</h2>
        ${recentLessons.map(l => `
          <div class="log-entry">
            <div>
              <div class="client-name">${l.client}</div>
              <div class="meta">${l.duration}${l.people > 1 ? ' &middot; ' + l.people + ' people' : ''}${l.notes ? ' &middot; ' + l.notes.substring(0, 30) : ''} &middot; ${l.time}</div>
            </div>
            <span class="badge ${l.guestMember === 'GUEST' ? 'badge-guest' : 'badge-member'}">${l.guestMember}</span>
          </div>
        `).join('')}
      `;
    }

    renderRecent();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
